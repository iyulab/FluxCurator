name: Publish NuGet Packages

on:
  push:
    branches:
      - main
    paths:
      - 'Directory.Build.props'

  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract version from Directory.Build.props
        id: version
        run: |
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Check if tag exists
        id: check_tag
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/v${{ steps.version.outputs.version }}"; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag v${{ steps.version.outputs.version }} already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag v${{ steps.version.outputs.version }} does not exist"
          fi

      - name: Setup .NET
        if: steps.check_tag.outputs.exists == 'false'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        if: steps.check_tag.outputs.exists == 'false'
        run: dotnet restore

      - name: Build
        if: steps.check_tag.outputs.exists == 'false'
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        if: steps.check_tag.outputs.exists == 'false'
        run: dotnet test --configuration Release --no-build --verbosity normal --hangdump --hangdump-timeout 5m

      # Pack every packable project in the solution, not just the two named today. Naming individual
      # csproj files here is the same defect class that left FluxImprover.LMSupply and
      # FileFlux.Providers.LMSupply unpublished at every version until someone noticed (see
      # iyulab/FluxImprover@4f01b46, iyulab/FileFlux nuget-publish.yml) — a package that is never
      # produced cannot fail to push, so the gap stays invisible until someone looks for it on
      # NuGet.org. Packing the solution plus a verification step closes it for any future addition.
      - name: Pack
        if: steps.check_tag.outputs.exists == 'false'
        run: dotnet pack FluxCurator.slnx --configuration Release --no-build --output ./nupkg

      - name: Verify all packable projects were produced
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          version="${{ steps.version.outputs.version }}"
          missing=0
          for csproj in $(grep -oP '(?<=Path=")src/[^"]+\.csproj' FluxCurator.slnx); do
            id=$(grep -oP '(?<=<PackageId>)[^<]+' "$csproj")
            if [ ! -f "./nupkg/${id}.${version}.nupkg" ]; then
              echo "::error::${id}.${version}.nupkg was not produced"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Push to NuGet
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create Git Tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body: |
            ## FluxCurator v${{ steps.version.outputs.version }}

            ### Packages
            - [FluxCurator.Core](https://www.nuget.org/packages/FluxCurator.Core/${{ steps.version.outputs.version }})
            - [FluxCurator](https://www.nuget.org/packages/FluxCurator/${{ steps.version.outputs.version }})

            ### Installation
            ```bash
            dotnet add package FluxCurator --version ${{ steps.version.outputs.version }}
            # Or core only (zero dependencies)
            dotnet add package FluxCurator.Core --version ${{ steps.version.outputs.version }}
            ```
          files: |
            ./nupkg/*.nupkg
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip - Version already published
        if: steps.check_tag.outputs.exists == 'true'
        run: |
          echo "Version ${{ steps.version.outputs.version }} has already been published. Skipping."
          echo "To publish a new version, update the <Version> tag in Directory.Build.props"
