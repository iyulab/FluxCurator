name: Publish NuGet Packages

on:
  push:
    branches:
      - main
    paths:
      - 'Directory.Build.props'

  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Nothing by default; every job below asks for what it needs.
permissions: {}

# The push to nuget.org is not made here. This workflow builds, tests and packs, uploads the packages as an artifact and asks the
# organization's central publisher (iyulab/nuget-publish) to push them; that repository holds the only trusted-publishing policy
# and checks this repository, this workflow file and the package ids against an allowlist. No NuGet credential lives here.
jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.check_tag.outputs.exists == 'false' && 'true' || 'false' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract version from Directory.Build.props
        id: version
        run: |
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      # A version whose tag exists was published by an earlier run: nothing to hand over.
      - name: Check if tag exists
        id: check_tag
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/v${{ steps.version.outputs.version }}"; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag v${{ steps.version.outputs.version }} already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag v${{ steps.version.outputs.version }} does not exist"
          fi

      - name: Setup .NET
        if: steps.check_tag.outputs.exists == 'false'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        if: steps.check_tag.outputs.exists == 'false'
        run: dotnet restore

      - name: Build
        if: steps.check_tag.outputs.exists == 'false'
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        if: steps.check_tag.outputs.exists == 'false'
        run: dotnet test --configuration Release --no-build --verbosity normal --hangdump --hangdump-timeout 5m

      # Pack every packable project in the solution, not just the two named today. Naming individual
      # csproj files here is the same defect class that left FluxImprover.LMSupply and
      # FileFlux.Providers.LMSupply unpublished at every version until someone noticed (see
      # iyulab/FluxImprover@4f01b46, iyulab/FileFlux nuget-publish.yml) — a package that is never
      # produced cannot fail to push, so the gap stays invisible until someone looks for it on
      # NuGet.org. Packing the solution plus a verification step closes it for any future addition.
      - name: Pack
        if: steps.check_tag.outputs.exists == 'false'
        run: dotnet pack FluxCurator.slnx --configuration Release --no-build --output ./nupkg

      - name: Verify all packable projects were produced
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          version="${{ steps.version.outputs.version }}"
          missing=0
          for csproj in $(grep -oP '(?<=Path=")src/[^"]+\.csproj' FluxCurator.slnx); do
            id=$(grep -oP '(?<=<PackageId>)[^<]+' "$csproj")
            if [ ! -f "./nupkg/${id}.${version}.nupkg" ]; then
              echo "::error::${id}.${version}.nupkg was not produced"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      # Only .nupkg and .snupkg files: the central publisher refuses an artifact that holds anything else.
      - name: Upload packages
        if: steps.check_tag.outputs.exists == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            ./nupkg/*.nupkg
            ./nupkg/*.snupkg
          if-no-files-found: error
          retention-days: 1

      - name: Skip - Version already published
        if: steps.check_tag.outputs.exists == 'true'
        run: |
          echo "Version ${{ steps.version.outputs.version }} has already been published. Skipping."
          echo "To publish a new version, update the <Version> tag in Directory.Build.props"

  # Asks the central publisher to push the packages and waits for its answer: this job succeeds only when they are on nuget.org.
  # Until the repository is on the publisher's allowlist the call is refused and the jobs after it do not run.
  publish:
    needs: pack
    if: ${{ needs.pack.outputs.publish == 'true' }}
    uses: iyulab/nuget-publish/.github/workflows/request.yml@2166748abf716fb58855228f65fc6b8f78c2780f # main
    permissions: {}
    secrets: inherit

  # The tag and the GitHub release exist only for a version that reached nuget.org.
  release:
    needs: [pack, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ./nupkg

      # Release notes = this version's CHANGELOG.md section. Every iyulab publish workflow carries this awk program
      # verbatim; change it in all of them or in none.
      - name: Release notes (this version's CHANGELOG section)
        shell: bash
        run: |
          VERSION=$(grep -oP '<(Version|VersionPrefix)>\K[^<]+' Directory.Build.props | head -1)
          awk -v v="$VERSION" '/^## /{if(p)exit;h=$0;sub(/^## +\[?v?/,"",h);c=substr(h,length(v)+1,1);if(index(h,v)==1&&(c==""||c=="]"||c==" "||c=="\t")){p=1;next}}p&&(n||$0!~/^[ \t]*$/){l[++n]=$0}END{while(n&&(l[n]~/^[ \t]*$/||l[n]~/^---+$/))n--;for(i=1;i<=n;i++)print l[i]}' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.pack.outputs.version }}
          body_path: release-notes.md
          name: Release v${{ needs.pack.outputs.version }}
          files: |
            ./nupkg/*.nupkg
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
